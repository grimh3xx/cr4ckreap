[package]
name = "brutereap"
version = "0.1.0"
edition = "2021"
authors = ["grimh3xx"]
description = "Bruteforce de login multi-protocolo para pentest autorizado (irmão online do credreap)."
license = "MIT"
repository = "https://github.com/grimh3xx/brutereap"
keywords = ["pentest", "bruteforce", "ftp", "http", "credentials"]

[[bin]]
name = "brutereap"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.42", features = ["rt-multi-thread", "net", "macros", "io-util", "sync", "time"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
base64 = "0.22"

[profile.release]
strip = true
lto = true
